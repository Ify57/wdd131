<section id="contact" class="contact-section">
  <h2>Contact Us</h2>
  <p>Have questions about eco-friendly travel? Send us a message below.</p>

  <!-- Lazy-loaded image -->
  <img src="images/contact-placeholder.jpg"
       data-src="images/contact.jpg"
       class="lazy-img"
       alt="Eco-friendly travel illustration"
       loading="lazy">

  <form id="contactForm" novalidate>
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required aria-required="true" />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required aria-required="true" />
    </div>

    <div class="form-group">
      <label for="reason">Reason for Contact</label>
      <select id="reason" required aria-required="true">
        <option value="">-- Select a reason --</option>
        <option value="travel">Eco Travel Advice</option>
        <option value="review">Product Review Help</option>
        <option value="support">Website Support</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Your Message</label>
      <textarea id="message" required aria-required="true"></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>

  <div id="responseMessage" aria-live="polite"></div>
</section>
