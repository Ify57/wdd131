<body>
    <header>
        <div class="first">
            <h3>Eco-Friendly</h3>

  <div class="wrap">
    <header>
      <h1>Eco-Friendly Travel Tips</h1>
      <p>Practical, tested tips to reduce your environmental impact while exploring the world.</p>
    </header>

    <div class="controls" aria-hidden="false">
      <label for="catSelect" class="hidden-visually">Filter category</label>
      <select id="catSelect" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>

      <label for="search" class="hidden-visually">Search tips</label>
      <input type="search" id="search" placeholder="Search tips or keywords" aria-label="Search tips">

      <button id="clearFilters" class="ghost" type="button">Clear</button>
      <button id="saveBtn" type="button">Save Favorites</button>

      <div id="favCount" aria-live="polite" style="margin-left:auto;color:var(--muted)"></div>
    </div>

    <main aria-live="polite">
      <section id="tipsGrid" class="grid" aria-label="Eco travel tips list">
        <!-- cards injected by JS -->
      </section>
      <div id="noResults" class="empty" style="display:none">No tips found. Try another search or category.</div>
    </main>

  </div>
